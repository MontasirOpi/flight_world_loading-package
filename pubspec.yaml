name: flight_world_loading
description: A high-performance, offline vector map flight search loading screen for Flutter with adaptive zoom, quadratic Bezier trajectory, and global airport resolution.
version: 0.0.1
homepage: https://github.com/MontasirOpi/flight_world_loading-package
repository: https://github.com/MontasirOpi/flight_world_loading-package
issue_tracker: https://github.com/MontasirOpi/flight_world_loading-package/issues
topics:
  - flight
  - loader
  - animation
  - map
  - travel

environment:
  sdk: ^3.0.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/geo/countries.json

  # To add assets to your package, add an assets section, like this:
